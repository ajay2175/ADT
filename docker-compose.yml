services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: adt
      POSTGRES_PASSWORD: adt
      POSTGRES_DB: adt
    ports:
      - "5432:5432"
    volumes:
      - adt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adt -d adt"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/adtgraph
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - adt_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      ADT_DATABASE_URL: postgresql://adt:adt@db:5432/adt
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: adtgraph
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  adt_pgdata:
  adt_neo4j:
