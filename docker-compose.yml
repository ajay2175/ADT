services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: adt
      POSTGRES_PASSWORD: adt
      POSTGRES_DB: adt
    ports:
      - "5432:5432"
    volumes:
      - adt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adt -d adt"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      ADT_DATABASE_URL: postgresql://adt:adt@db:5432/adt
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  adt_pgdata:
